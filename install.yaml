name: typo3-multi-version-extension

pre_install_actions:
  - |
    #ddev-description:Check for incompatible server type
    if [ "${DDEV_WEBSERVER_TYPE}" != "apache-fpm" ] && [ "${DDEV_WEBSERVER_TYPE}" != "nginx-fpm" ]; then
      echo "This package only works with the apache-fpm or nginx-fpm webserver type";
      exit 1;
    fi

  - |
    #ddev-description:Remove a pre-rename docker-compose.web.yaml
    old_compose="${DDEV_APPROOT}/.ddev/docker-compose.web.yaml"
    # Early add-on versions generated this file under the generic
    # "docker-compose.web.yaml" name before it was renamed to
    # docker-compose.typo3-setup.yaml. Left in place, it sorts after the
    # current file and silently wins on every conflicting key (e.g.
    # TYPO3_VERSIONS), permanently shadowing config.yaml/project changes with
    # whatever was true the day the project was first installed. Only remove
    # it when it carries this add-on's own fingerprint - docker-compose.web.yaml
    # is otherwise a generic DDEV filename real projects may use for
    # unrelated customizations, so this must never touch an unrelated file.
    if [ -f "$old_compose" ] && grep -q 'EXTENSION_KEY=' "$old_compose" && grep -q 'TYPO3_VERSIONS=' "$old_compose"; then
      rm -f "$old_compose"
      echo "Removed stale pre-rename .ddev/docker-compose.web.yaml (superseded by docker-compose.typo3-setup.yaml)."
    fi

project_files:
  - .setup/scripts/utils.sh
  - .setup/scripts/write-git-info.sh
  - .setup/project.sh.example
  - .setup/docker-compose.project.yaml.example
  - .setup/templates/index.php
  - .setup/Tests/Acceptance/Fixtures/
  - apache/10.conf
  - apache/20.conf
  - nginx_full/nginx-site.conf
  - commands/host/launch
  - commands/host/worktree-init
  - commands/host/worktree-remove
  - commands/web/.install-11
  - commands/web/.install-12
  - commands/web/.install-13
  - commands/web/.install-14
  - commands/web/11
  - commands/web/12
  - commands/web/13
  - commands/web/14
  - commands/web/all
  - commands/web/install
  - docker-compose.typo3-setup.yaml

ddev_version_constraint: '>= v1.24.10'

post_install_actions:
  - |
    #ddev-description:Replace package name
    export LC_ALL=C LANG=C
    if [ -f ${DDEV_APPROOT}/composer.json ]; then
      composer_name=$(jq -r '.name' ${DDEV_APPROOT}/composer.json)
      if [ ! -z "$composer_name" ]; then

        if [[ "$OSTYPE" == "darwin"* ]]; then
          find ${DDEV_APPROOT}/.ddev -type f -exec sed -i '' -e "s|vendor/custom-extension-key|${composer_name}|g" {} +
        else
          find ${DDEV_APPROOT}/.ddev -type f -exec sed -i'' -e "s|vendor/custom-extension-key|${composer_name}|g" {} +
        fi
      fi
    fi

  - |
    #ddev-description:Replace extension key and name
    export LC_ALL=C LANG=C
    extension_name="${DDEV_PROJECT}"
    extension_key=$(echo "$extension_name" | tr '-' '_')
    if [ -z "$extension_name" ]; then
      echo "DDEV_PROJECT environment variable is not set."
      exit 1
    fi

    if [[ "$OSTYPE" == "darwin"* ]]; then
      find ${DDEV_APPROOT}/.ddev -type f -exec sed -i '' -e "s/custom-extension-key/${extension_name}/g" {} +   
      find ${DDEV_APPROOT}/.ddev -type f -exec sed -i '' -e "s/custom_extension_key/${extension_key}/g" {} + 
    else
      find ${DDEV_APPROOT}/.ddev -type f -exec sed -i'' -e "s/custom-extension-key/${extension_name}/g" {} +    
      find ${DDEV_APPROOT}/.ddev -type f -exec sed -i'' -e "s/custom_extension_key/${extension_key}/g" {} +
    fi

    echo "Set extension key to ${extension_key} and extension name to ${extension_name} in"
    echo " - .ddev/docker-compose.typo3-setup.yaml"
  - |
    #ddev-description:Create a config.typo3-setup.yaml
    # additional_hostnames must match the TYPO3_VERSIONS this project actually
    # installs. A project-owned docker-compose.project.yaml (see
    # docs/configuration.md) survives updates and can override TYPO3_VERSIONS,
    # so it takes precedence over the add-on-managed docker-compose.typo3-setup.yaml;
    # fall back to that file's own default when neither has a match.
    typo3_versions=""
    override_compose="${DDEV_APPROOT}/.ddev/docker-compose.project.yaml"
    if [ -f "$override_compose" ]; then
      typo3_versions=$(grep -oE 'TYPO3_VERSIONS=[0-9 ]+' "$override_compose" | head -1 | cut -d= -f2)
    fi
    if [ -z "$typo3_versions" ]; then
      typo3_versions=$(grep -oE 'TYPO3_VERSIONS=[0-9 ]+' "${DDEV_APPROOT}/.ddev/docker-compose.typo3-setup.yaml" | head -1 | cut -d= -f2)
    fi
    [ -z "$typo3_versions" ] && typo3_versions="12 13 14"

    {
      echo "type: php"
      echo "docroot: .Build"
      echo "additional_hostnames:"
      for version in $typo3_versions; do
        echo "  - ${version}.${DDEV_PROJECT}"
      done
      echo "hooks:"
      echo "   post-start:"
      echo "    - exec: mkdir -p /var/www/html/.Build/ && cp -r /var/www/html/.ddev/.setup/templates/. /var/www/html/.Build/ && bash /var/www/html/.ddev/.setup/scripts/write-git-info.sh"
    } >${DDEV_APPROOT}/.ddev/config.typo3-setup.yaml
    echo "Created .ddev/config.typo3-setup.yaml"

  - |
    #ddev-description:Create Tests folder

    if [ -d "${DDEV_APPROOT}/.ddev/.setup/Tests/Acceptance" ]; then
      mkdir -p "${DDEV_APPROOT}/Tests/Acceptance"
      # BSD cp (macOS) exits 1 under -n as soon as it skips any existing file,
      # unlike GNU cp which exits 0 - this copy is no-clobber-by-design (an
      # update must not overwrite a project's customized fixtures), so a skip
      # is not a failure on either platform.
      cp -Rn "${DDEV_APPROOT}/.ddev/.setup/Tests/Acceptance/." "${DDEV_APPROOT}/Tests/Acceptance/" || true
      rm -rf "${DDEV_APPROOT}/.ddev/.setup/Tests"
      echo "Installed Acceptance test fixtures"
    fi

  - |
    #ddev-description:Update .gitignore
    gitignore_path="${DDEV_APPROOT}/.gitignore"
    entry=".Build/"

    if [ -f "$gitignore_path" ]; then
      if ! grep -q "^${entry}$" "$gitignore_path"; then
        echo "$entry" >> "$gitignore_path"
        echo "Added '${entry}' to .gitignore."
      fi
    else
      # If .gitignore does not exist, create the file and add the entry
      echo "$entry" > "$gitignore_path"
      echo "Created .gitignore and added '${entry}'."
    fi

  - |
    #ddev-description:Outro
    echo "###############################################"
    echo "✓ TYPO3 multi-version extension setup complete."
    echo "You can now run 'ddev restart' to start the environment and 'ddev install all' to install the TYPO3 instances."
    echo "Launch the intro page with 'ddev launch' or open ${DDEV_PRIMARY_URL}."
    echo "For more information, see the https://github.com/konradmichalik/ddev-typo3-multi-version-extension/blob/main/README.md file."

removal_actions:
  - rm -f ${DDEV_APPROOT}/.ddev/config.typo3-setup.yaml
  - rm -f "${DDEV_APPROOT}/.ddev/config.zz-worktree.local.yaml"
  - rm -rf "${DDEV_APPROOT}/.ddev/.setup/scripts"
  - rm -rf "${DDEV_APPROOT}/.ddev/.setup/templates"
  - rm -rf "${DDEV_APPROOT}/.ddev/.setup/Tests"
  - rm -f "${DDEV_APPROOT}/.ddev/.setup/project.sh.example"
  - rm -f "${DDEV_APPROOT}/.ddev/.setup/docker-compose.project.yaml.example"
