#ddev-generated
# If you want to take over this file and customize it, remove the line above
# and ddev will respect it and won't overwrite the file.
# See https://ddev.readthedocs.io/en/stable/users/extend/customization-extendibility/#custom-nginx-configuration
#
# Serves the version hosts, like apache/20.conf; also does the routing TYPO3's .htaccess does on Apache.
# Not nginx-site.conf, since DDEV regenerates that one.
# Routes by the numeric Host prefix, so it works for any project name.

# TYPO3 11/12 serve backend routes (/typo3/main, ...) from typo3/index.php,
# 13+ from the main index.php
map $t3version $typo3_backend_entry {
    11       /typo3/index.php;
    12       /typo3/index.php;
    default  /index.php;
}

# <11-14>.<anything> -> .Build/<version>/public
server {
    listen 80;
    listen 443 ssl;
    server_name ~^(?<t3version>1[1-4])\..*$;

    root /var/www/html/.Build/$t3version/public;

    ssl_certificate /etc/ssl/certs/master.crt;
    ssl_certificate_key /etc/ssl/certs/master.key;

    include /etc/nginx/monitoring.conf;

    index index.php;
    sendfile off;
    error_log /dev/stdout info;
    access_log /var/log/nginx/access.log;

    location / {
        absolute_redirect off;
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location /typo3/ {
        absolute_redirect off;
        try_files $uri $typo3_backend_entry$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_intercept_errors off;
        fastcgi_read_timeout 10m;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param HTTPS $fcgi_https;
    }

    location ~* /\.(?!well-known\/) {
        deny all;
    }

    location ~* (?:\.(?:bak|conf|dist|fla|in[ci]|log|psd|sh|sql|sw[op])|~)$ {
        deny all;
    }

    include /etc/nginx/common.d/*.conf;
    include /mnt/ddev_config/nginx/*.conf;
}
